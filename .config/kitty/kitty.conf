# BEGIN_KITTY_FONTS
font_family      family='JetBrains Mono' style=Light variable_name=JetBrainsMono
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include catppucin-mocha-theme.conf
# END_KITTY_THEME

# font_size 14.75
font_size 15


#modify cell
modify_font cell_width 95%
modify_font cell_height 130%

# Make kitty borderless
# hide_window_decorations yes
hide_window_decorations titlebar-only
window_border_width 0.5
window_padding_width 0

# key binding
## jump to end of line:
map super+right send_text all \x05
## jump to start of line:
map super+left send_text all \x01
# delete line from cursor position to start of line:
map super+backspace send_text all \x15
## undo:
map super+z send_text all \x1f

# map ctrl+shift+arrow 
map ctrl+shift+left send_text all \x1b[1;6D
map ctrl+shift+right send_text all \x1b[1;6C

# mac navigation
map alt+left send_text all \x1b\x62
map alt+right send_text all \x1b\x66

#cursor config
cursor_shape block
shell_integration no-cursor
cursor_stop_blinking_after 0
cursor #FFA500

#tab bar config
tab_bar_min_tabs 2
tab_bar_edge top
tab_bar_style separator
tab_separator "      ┇       "
# tab_powerline_style slanted

#disable sounds when nothing is found
# enable_audio_bell no
# bell_on_tab "🔔 "


# ligature config
disable_ligatures cursor

# hide mouse
mouse_hide_wait -1

# background_opacity 0.90
background_opacity 1
background_blur 20


# cursor trail
cursor_trail 1
# cursor_trail_decay 0.1 0.4
# cursor_trail_start_threshold 5


macos_option_as_alt yes

scrollback_lines 10000

allow_remote_control yes
listen_on unix:/tmp/kitty
term xterm-kitty
scrollback_lines 10000
copy_on_select yes
clipboard_control write-clipboard write-primary
enable_audio_bell no
confirm_os_window_close 0
enabled_layouts splits,tall,stack


# only show session tabs
tab_bar_filter session:~ or session:^$
tab_title_template "{tab.title or session_name}"

# Prefix: C-a (tmux-style key sequence)
# Use ctrl+a><key> just like tmux prefix.
map ctrl+a>ctrl+a send_text all \x01

# Splits (tmux | and _)
map ctrl+a>shift+backslash launch --location=vsplit --cwd=current
map ctrl+a>_              launch --location=hsplit --cwd=current

# Tabs (tmux windows)
map ctrl+a>c new_tab_with_cwd
map ctrl+a>n next_tab
map ctrl+a>b previous_tab
map ctrl+a>x close_tab
map cmd+w close_window

# Direct tab switching (tmux-style window numbers)
map ctrl+a>1 goto_tab 1
map ctrl+a>2 goto_tab 2
map ctrl+a>3 goto_tab 3
map ctrl+a>4 goto_tab 4
map ctrl+a>5 goto_tab 5
map ctrl+a>6 goto_tab 6
map ctrl+a>7 goto_tab 7
map ctrl+a>8 goto_tab 8
map ctrl+a>9 goto_tab 9

# Last used tab (tmux last-window)
map ctrl+a>space kitten last_tab.py

# Zoom (tmux maximize pane)
map ctrl+a>m combine : toggle_layout stack : scroll_prompt_to_bottom

# Reload config (tmux prefix+r)
map ctrl+a>r load_config_file

# Copy mode (tmux prefix+v)
scrollback_pager env NVIM_APPNAME=nvim-custom /opt/homebrew/bin/nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -
map ctrl+a>v show_scrollback

# Resize panes
map ctrl+a>h kitten relative_resize.py left
map ctrl+a>j kitten relative_resize.py down
map ctrl+a>k kitten relative_resize.py up
map ctrl+a>l kitten relative_resize.py right

# Vim-Kitty navigator (matches vim-tmux-navigator muscle memory)
map ctrl+h kitten pass_keys.py left   ctrl+h "nvim"
map ctrl+j kitten pass_keys.py bottom ctrl+j "nvim"
map ctrl+k kitten pass_keys.py top    ctrl+k "nvim"
map ctrl+l kitten pass_keys.py right  ctrl+l "nvim"

# Move tabs (tmux C-S-Left/Right)
map ctrl+shift+left  move_tab_backward
map ctrl+shift+right move_tab_forward


# save Session
map ctrl+a>shift+s save_as_session --use-foreground-process --relocatable
# go to last session
map ctrl+a>enter goto_session -1

# Restore the home session on startup
startup_session $HOME/.config/kitty/sessions/config-tweak.kitty-session

map ctrl+a>o launch --type=overlay /bin/zsh -c "$HOME/.config/kitty/scripts/kitty-list-sessions.sh"
map ctrl+a>z launch --type=overlay /bin/zsh -c "$HOME/.config/kitty/scripts/kitty-zoxide-session.sh"

map ctrl+a>s goto_session ~/.config/kitty/sessions/
